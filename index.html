<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untuk Alya ❤️</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            position: relative;
        }

        /* Ambient Glow & Night Sky */
        .night-sky {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at bottom, #111726 0%, #000000 100%);
            z-index: 1;
        }

        /* Glowing Floating Particles / Fireflies */
        .firefly {
            position: absolute;
            width: 5px;
            height: 5px;
            background-color: #ffea9f;
            border-radius: 50%;
            box-shadow: 0 0 10px 3px #ffea9f, 0 0 20px 6px #ff75a0;
            opacity: 0.8;
            pointer-events: none;
            animation: float 6s infinite ease-in-out;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) scale(0.6);
                opacity: 0;
            }
            30% {
                opacity: 0.9;
            }
            80% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-10vh) scale(1.1);
                opacity: 0;
            }
        }

        /* Main Container Card */
        .content-card {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 40px 30px;
            max-width: 500px;
            width: 90%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6),
                        0 0 30px rgba(255, 117, 160, 0.15);
            animation: fadeInCard 1.5s ease-out forwards;
        }

        @keyframes fadeInCard {
            from {
                opacity: 0;
                transform: translateY(25px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Decorative Sparkle Icon */
        .decor-icon {
            font-size: 2.2rem;
            margin-bottom: 12px;
            display: inline-block;
            animation: heartPulse 1.8s infinite ease-in-out;
        }

        @keyframes heartPulse {
            0%, 100% {
                transform: scale(1);
                filter: drop-shadow(0 0 8px rgba(255, 105, 180, 0.7));
            }
            50% {
                transform: scale(1.2);
                filter: drop-shadow(0 0 16px rgba(255, 20, 147, 0.9));
            }
        }

        /* Main Greeting Title */
        .title {
            font-size: 2.4rem;
            font-weight: 700;
            letter-spacing: 3px;
            color: #ffffff;
            text-transform: uppercase;
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(255, 117, 160, 0.8),
                         0 0 25px rgba(255, 105, 180, 0.6),
                         0 0 45px rgba(255, 20, 147, 0.4);
            line-height: 1.2;
        }

        /* Subtitle Message */
        .subtitle {
            font-size: 1.15rem;
            font-weight: 400;
            letter-spacing: 2px;
            color: #f7d6e6;
            text-transform: uppercase;
            margin-bottom: 35px;
            line-height: 1.6;
            text-shadow: 0 0 8px rgba(255, 182, 193, 0.6);
        }

        /* Action Button */
        .btn-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 16px 42px;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 2.5px;
            color: #ffffff;
            text-decoration: none;
            background: linear-gradient(135deg, #ff75a0, #f72585);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 117, 160, 0.6),
                        0 0 35px rgba(247, 37, 133, 0.35);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: btnGlow 2s infinite ease-in-out;
            position: relative;
            overflow: hidden;
        }

        .btn-action:hover {
            transform: scale(1.06);
            box-shadow: 0 0 30px rgba(255, 117, 160, 0.9),
                        0 0 50px rgba(247, 37, 133, 0.6);
            background: linear-gradient(135deg, #ff85ab, #ff3399);
        }

        .btn-action:active {
            transform: scale(0.97);
        }

        @keyframes btnGlow {
            0%, 100% {
                box-shadow: 0 0 15px rgba(255, 117, 160, 0.5), 0 0 30px rgba(247, 37, 133, 0.3);
            }
            50% {
                box-shadow: 0 0 28px rgba(255, 117, 160, 0.85), 0 0 45px rgba(247, 37, 133, 0.55);
            }
        }

        /* Fade-out transition when button is clicked */
        .fade-out {
            opacity: 0 !important;
            transform: scale(0.95) !important;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        /* Small romantic footer touch */
        .footer-note {
            margin-top: 25px;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="night-sky" id="sky"></div>

    <div class="content-card" id="card">
        <div class="decor-icon">💖</div>
        <h1 class="title">HALLO ALYA</h1>
        <p class="subtitle">SEMANGAT TERUS YA PACAR KU</p>
        <button class="btn-action" id="btnOpen" onclick="goToFlower()">
            <span>PENCET INI</span>
            <span>🌸</span>
        </button>
        
    </div>

    <script>
        // Generate floating glowing particles / fireflies
        const sky = document.getElementById('sky');
        const fireflyCount = 28;

        for (let i = 0; i < fireflyCount; i++) {
            const firefly = document.createElement('div');
            firefly.classList.add('firefly');
            
            // Random positions and timing
            firefly.style.left = Math.random() * 100 + 'vw';
            firefly.style.top = Math.random() * 100 + 'vh';
            firefly.style.animationDuration = (Math.random() * 5 + 4) + 's';
            firefly.style.animationDelay = (Math.random() * 5) + 's';
            
            // Variasi ukuran & warna cahaya
            const size = Math.random() * 4 + 3;
            firefly.style.width = size + 'px';
            firefly.style.height = size + 'px';
            
            if (Math.random() > 0.5) {
                firefly.style.backgroundColor = '#ff75a0';
                firefly.style.boxShadow = `0 0 10px 3px #ff75a0, 0 0 20px 6px #f72585`;
            }

            sky.appendChild(firefly);
        }

        // Smooth transition to flower.html
        function goToFlower() {
            const card = document.getElementById('card');
            card.classList.add('fade-out');
            
            // Short delay for smooth fade transition
            setTimeout(() => {
                window.location.href = 'flower.html';
            }, 600);
        }
    </script>
</body>
</html>
